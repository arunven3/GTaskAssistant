name: Build & Push Docker Image to HF Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v2

      # Build the Docker image
      - name: Build Docker image
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          IMAGE_NAME: my-task-assistant
        run: docker build . --file DockerFile --tag $HF_USERNAME/g-task-assistant:latest
